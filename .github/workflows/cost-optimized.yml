name: Cost Optimized Workflow

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "README.md"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(github.ref, 'main')
    runs-on: ubuntu-latest
    steps:
    - name: Check Out Code
      uses: actions/checkout@v4

    - name: Set Up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      run: pytest tests/
